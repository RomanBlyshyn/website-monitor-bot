[project]
name = "website-monitor-bot"
version = "0.1.0"
description = "Config-driven website monitor that sends Telegram alerts for new listings and price drops."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "feedparser>=6.0",
    "httpx>=0.27",
    "playwright>=1.48",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
